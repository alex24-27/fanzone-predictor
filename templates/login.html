{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 40px auto; padding: 30px;">
    <h2 style="margin-top: 0; margin-bottom: 20px;">Account Sign In</h2>
    
    <form method="POST" action="{{ url_for('login') }}" id="login-form">
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #4a5568;">
                Username <span style="color: #e53e3e;">*</span>
            </label>
            <input type="text" id="login-username" name="username" required style="width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 20px;">
            <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #4a5568;">
                Password <span style="color: #e53e3e;">*</span>
            </label>
            <input type="password" id="login-password" name="password" required style="width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 4px;">
        </div>

        <button type="submit" id="login-btn" disabled class="btn" style="width: 100%; padding: 10px; background: #cbd5e0; color: #718096; cursor: not-allowed; font-weight: bold; border: none; border-radius: 4px;">
            Sign In
        </button>
    </form>
</div>
{% endblock %}
